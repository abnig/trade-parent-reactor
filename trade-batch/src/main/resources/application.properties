# Application
spring.application.name=csv-batch-processor

# Trade book Batch Configuration
batch.truncate-flag=FALSE
batch.recursive-flag=FALSE
batch.chunk-size=1000
batch.skip-limit=100
batch.csv.input-file-path=${CSV_INPUT_FILE:/Users/abnig19/zerodha/files-trade/}
batch.csv.error-file=${CSV_ERROR_FILE:/Users/abnig19/zerodha/files-trade-error/error_report.txt}
batch.csv.archived-file=${CSV_ERROR_FILE:/Users/abnig19/zerodha/files-trade-archived}

# Ledger Batch Configuration
batch.ledger-truncate-flag=FALSE
batch.ledger-recursive-flag=FALSE
batch.ledger-chunk-size=1000
batch.ledger-skip-limit=3
batch.csv.ledger-input-file-path=${CSV_INPUT_FILE:/Users/abnig19/zerodha/files-ledger/}
batch.csv.ledger-error-file=${CSV_ERROR_FILE:/Users/abnig19/zerodha/files-ledger-error/ledger_error_report.txt}
batch.csv.ledger-archived-file=${CSV_ERROR_FILE:/Users/abnig19/zerodha/files-ledger-archived}

# Logging Levels
logging.level.com.trading=INFO
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.jdbc=DEBUG

# Logging Pattern
logging.pattern.console=%date [%thread] %-5level %logger{360} - %msg%n

management.tracing.enabled=true
management.metrics.enabled=true

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none

# Schema migrations are owned by trade-rest; batch must not create a second
# Flyway migration runner against the shared PostgreSQL schema.
spring.flyway.enabled=false

# Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# SQL Init
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
