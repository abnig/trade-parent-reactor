# Local development PostgreSQL, public schema.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgresd?currentSchema=public
server.port=6666

# Spring Boot binds SPRING_MAIL_HOST directly. Credentials stay outside this file.
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
app.password-recovery.from=${PASSWORD_RESET_FROM:}
app.password-recovery.reset-url=${PASSWORD_RESET_URL:http://localhost:7777/reset-password}
