spring.application.name=trade-rest

server.port=8082

logging.level.org.springframework.ai=DEBUG
logging.level.io.modelcontextprotocol=INFO


# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA
jdbc.template.fetch-size=100
spring.jpa.hibernate.ddl-auto=none

# REST owns migration execution for the shared PostgreSQL schema.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema baseline
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Browser authentication uses server-side sessions, never tokens in local storage.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Configure SMTP via SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD and provider-appropriate TLS settings. No credentials in source.
app.password-recovery.from=${PASSWORD_RESET_FROM:}
app.password-recovery.reset-url=${PASSWORD_RESET_URL:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
