spring.application.name=trade-rest

server.port=8082

logging.level.org.springframework.ai=DEBUG
logging.level.io.modelcontextprotocol=INFO


# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA
jdbc.template.fetch-size=100
spring.jpa.hibernate.ddl-auto=none

# REST owns migration execution for the shared PostgreSQL schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=4
spring.flyway.baseline-description=Existing schema baseline
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
